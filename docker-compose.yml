services:
  kiro-rs:
    # 使用当前仓库本地构建（支持启动前从 GitHub 拉取 config.json）
    build: .
    # 使用已发布镜像时可改为：
    # image: myuan6/kiro-rs:latest
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8990:8990"
    volumes:
      - ./config/:/app/config/
    environment:
      # 启用后会在容器启动前拉取 /app/config/config.json
      GITHUB_CONFIG_SYNC: ${GITHUB_CONFIG_SYNC:-0}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_CONFIG_PATH: ${GITHUB_CONFIG_PATH:-}
      GITHUB_REF: ${GITHUB_REF:-main}
    restart: unless-stopped
